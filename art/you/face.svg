<?xml version="1.0" encoding="UTF-8"?>
<!-- Your face, drawn once. Every balloon in the app wears it.
     One layer per expression; the app shows one at a time. Keep the frame (viewBox) as it is:
     the face is placed into the balloon's anchor-face box, centre to centre. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     viewBox="-6 -6 12 12" width="120" height="120">
  <g id="face-calm" inkscape:groupmode="layer" inkscape:label="face-calm">
    <g id="eyes">
      <circle cx="-3" cy="-0.8" r="1.7" fill="#ffffff"/>
      <circle cx="3" cy="-0.8" r="1.7" fill="#ffffff"/>
    </g>
    <path id="mouth" d="M-3.8 3 q3.8 3.6 7.6 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g id="face-blink" inkscape:groupmode="layer" inkscape:label="face-blink" style="display:none">
    <g id="eyes-shut" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round">
      <path d="M-4.6 -0.8 q1.6 1.2 3.2 0"/>
      <path d="M1.4 -0.8 q1.6 1.2 3.2 0"/>
    </g>
    <path d="M-3.8 3 q3.8 3.6 7.6 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
